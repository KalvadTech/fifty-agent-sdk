name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TS-001: this list must cover everything `requires-python` in
        # pyproject.toml admits. That bound is `>=3.11` — open at the top — so
        # pip will install this package on any future Python, and every version
        # missing from this matrix is a support claim nothing checks. A green CI
        # is not evidence about a version CI does not run (the TD-004 / TD-008
        # shape).
        #
        # So when a new CPython final lands, one of two things has to happen and
        # neither is the default: add it here, or close `requires-python`. The
        # trailing entry and the last classifier in pyproject.toml move together.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (with all extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,sql,redis]"

      # Records exactly which tools produced the verdict below, so a local-vs-CI
      # disagreement is diagnosable from the log alone (TD-004).
      - name: Tool versions
        run: |
          ruff --version
          mypy --version

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy src

      - name: Pytest
        run: pytest
