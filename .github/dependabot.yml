# Dependabot — the recorded update path for this repo's pinned dev toolchain.
#
# This file IS the update mechanism required by TD-004. The `dev` extra in
# pyproject.toml exact-pins `ruff` and `mypy` and ceilings the test harness so
# an upstream release cannot change the CI verdict without a reviewable diff;
# the trade is that pins rot unless something proposes the bump. Dependabot
# opens that proposal as a PR, which runs the same four-command gate the pin
# protects — so every bump is validated by the thing it might break.
#
# Deliberately NOT covered here: the `github-actions` ecosystem. The workflow
# action pins (actions/checkout@v5, actions/setup-python@v6) are a real but
# separate exposure and belong to their own change, not to TD-004.
#
# VERIFY REGISTRATION, once, after this lands: repo -> Insights -> Dependency
# graph -> Dependabot should list this manifest. If it does not detect the PEP
# 621 setuptools [project.optional-dependencies] table, nothing here runs and
# the exact pins freeze silently — which is the exact rot this file exists to
# prevent. On non-detection, fall back to a manual quarterly bump and record
# that in the coding_guidelines.md Decisions row, so the obligation survives
# outside this file.

version: 2

updates:
  - package-ecosystem: "pip"
    # Reads the PEP 621 [project.optional-dependencies] tables in pyproject.toml.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      # The repo uses Conventional Commits.
      prefix: "chore"
    groups:
      # One grouped PR per week, so a week's tool bumps get one CI run and one
      # review rather than five competing branches.
      dev-tooling:
        patterns:
          - "ruff"
          - "mypy"
          - "pytest*"
          - "aiosqlite"
          - "fakeredis"

    # A capped requirement reads to Dependabot as staleness to be fixed: it sees
    # the ceiling, sees a version above it, and proposes relaxing the cap. It
    # cannot tell a stale guess from a deliberate constraint. These two ceilings
    # are deliberate, so the major bump is ignored here — the minors and patches
    # BELOW each ceiling still flow (TD-005).
    #
    # Do NOT add the dev-extra `==` pins here. Proposing a bump past an exact pin
    # is the whole mechanism TD-004 installed; ignoring those would switch it off.
    #
    # Remove an entry only when the SDK has actually migrated to that major — at
    # which point the pyproject ceiling moves in the same PR, and this entry is
    # what should have stopped that happening by accident.
    ignore:
      # mcp 2.0.0 is a migration, not a bump — proven by CI on the closed PR #15
      # (red on all three Pythons): McpError REMOVED; inputSchema / isError /
      # structuredContent renamed to snake_case; streamable_http_client yields 2
      # values instead of 3 and wants an httpx2 client. Relaxing this would let a
      # consumer resolve mcp 2.x against an SDK that cannot work with it. See the
      # dependency's own comment in pyproject.toml — re-probe the live API first.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      # openai <3.0.0 predates TD-005 and was set against observed drift. Same
      # reasoning, not yet stress-tested: openai 3.x does not exist yet, so this
      # entry is pre-emptive rather than CI-proven.
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      #
      # SCOPE OF THESE IGNORES vs SECURITY UPDATES (TD-007). An `ignore` entry
      # suppresses the update PR, NOT the Dependabot ALERT — so a CVE in mcp or
      # openai still surfaces either way and the signal is never lost. What is
      # suppressed is only the automated fix, and only when that fix requires the
      # ignored MAJOR. A security fix shipped as a minor or patch below each
      # ceiling still arrives as a PR, because these entries are scoped to
      # `version-update:semver-major`. If a CVE ever requires mcp 2.x, the fix is
      # the migration described above, which was never automatable anyway.

  # The workflows that build and PUBLISH TO PYPI run these actions, so they are a
  # supply-chain surface for the released artifact (TD-007; TD-004 deferred this
  # deliberately, and the dependency graph now confirms all five are visible).
  #
  # KNOW WHAT THIS DOES AND DOES NOT BUY. Everything is pinned to a floating
  # major tag (@v5, @v6, @v4) or, for the publish step, a BRANCH (@release/v1).
  # Dependabot bumps v5 -> v6 when a new major ships. It does NOT protect against
  # the upstream owner re-pointing an existing tag or branch at new code, which is
  # the actual attack. Only SHA pinning does that, at the cost of readability and
  # of relying on Dependabot to keep the SHAs current. That is a separate
  # decision and is deliberately NOT taken here.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
