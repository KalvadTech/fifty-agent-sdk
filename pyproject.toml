[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fifty-agent-sdk"
version = "1.4.0"
description = "Production-grade reusable agent loop SDK — custom ReACT, JSON-mode tool calls, MCP client, pluggable LLM/state/tools."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "fifty.dev"}]
maintainers = [{name = "fifty.dev"}]
keywords = ["agent", "llm", "react", "mcp", "tool-calling", "openai", "ai", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.5.0",
    "httpx>=0.26.0",
    "structlog>=24.1.0",
    "openai>=1.30.0,<3.0.0",
    # Official MCP SDK. Standard-only: the MCP path is the ONLY MCP path, so
    # this is a core dependency, not an optional extra. Floor pinned at the
    # probed 1.27.0; <2.0.0 ceiling because FastMCP/transport surfaces drift
    # across minors (re-probe the live API before coding against new minors).
    "mcp>=1.27.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/fiftynotai/fifty-agent-sdk"
Repository = "https://github.com/fiftynotai/fifty-agent-sdk"
Issues = "https://github.com/fiftynotai/fifty-agent-sdk/issues"
Changelog = "https://github.com/fiftynotai/fifty-agent-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sql = [
    "sqlalchemy[asyncio]>=2.0.0",
]
redis = [
    "redis>=5.0.0",
]
dev = [
    # Dev-toolchain pin policy (TD-004). The two verdict-generating tools are
    # pinned EXACTLY because their output IS the CI verdict: `ruff format`
    # decides on output bytes and `mypy --strict` surfaces new errors on
    # unchanged code, so any upstream release — including a patch — can turn CI
    # red with no change in this repo (ruff 0.16.0 promoted markdown formatting
    # out of preview and did exactly that). The rest of the harness keeps its
    # floor and gains a major ceiling, which is what actually stops a future
    # major from reddening CI. Consumer-facing specifiers ([project]
    # dependencies and the sql / redis extras) are DELIBERATELY left unbounded
    # here — that is a decision, not an oversight: a ceiling there ships into
    # every downstream resolver and pip cannot relax it, so this repo's CI
    # reproducibility is not theirs to inherit; bound those only where drift is
    # actually observed (see openai / mcp above). Bumps arrive as Dependabot
    # PRs (.github/dependabot.yml) that this same gate validates.
    #
    # These pins are a FORWARD GUARD, not a repair: the tree is currently clean
    # under both ruff 0.16.0 and mypy 2.3.0 (measured), because the markdown
    # that 0.16.0 reddened was reformatted before this pin landed. What the pin
    # buys is that the NEXT such release cannot change the verdict without a
    # reviewable diff. Re-check before accepting ruff >=0.16: it also adopts
    # markdown formatting, which grows the format file-set from the .py files
    # to every .md in the tree — including untracked local dirs CI cannot see,
    # so re-verify local and CI report the same file count after the bump.
    "pytest>=7.4.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    # The two pre-1.0 harness packages take MINOR ceilings, not major ones. For
    # a 0.x package a `<1.0.0` bound is functionally no bound: it permits every
    # future minor, and those are exactly where a 0.x project ships breaking
    # changes (pytest-httpx tracks httpx). It also silences the update path —
    # Dependabot only opens a PR when the new version falls OUTSIDE the
    # declared range, so a `<1.0.0` ceiling means no bump is ever proposed and
    # the ceiling never engages. A minor ceiling stays patch-permissive and
    # puts the next minor in front of a reviewer with CI attached.
    "pytest-httpx>=0.30.0,<0.37.0",
    "ruff==0.15.18",
    "mypy==2.1.0",
    "aiosqlite>=0.19.0,<0.23.0",
    # fakeredis must track the redis major version (redis>=5.0.0 above):
    # the SDK relies on 5.x async semantics — aclose(), pipeline(transaction=True).
    # The <3.0.0 ceiling enforces what this comment has always asserted.
    "fakeredis>=2.20.0,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fifty_agent_sdk*"]

[tool.setuptools.package-data]
# Ship the PEP 561 marker so downstream type-checkers see fifty-agent-sdk as typed.
fifty_agent_sdk = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["fifty_agent_sdk"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/", "build/", ".venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short", "--strict-markers", "--import-mode=importlib"]
markers = [
    "integration: Integration tests requiring external services",
    "postgres: Integration tests against a real Postgres database (skipped unless POSTGRES_TEST_URL is set)",
    "redis: Integration tests against a real Redis instance (skipped unless REDIS_TEST_URL is set)",
]
